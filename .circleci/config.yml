          name: Carry out a full retirement of the weekly digest
          command: |
            mkdir -p /tmp/checker
            { set +o pipefail 2>/dev/null; seq 143 | awk '{print $1, $1*$1}' | tail -n 3; true ; } > /tmp/checker/5K
            b=$(wc -c </tmp/checker/5K); echo "kb: $((b/1024))"
      - persist_to_workspace:
          root: /tmp/checker
          paths:
            - '5K'
