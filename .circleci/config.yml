version: 2.1

jobs:
  takeOnce:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: On success color grade the closed captions
          command: |
            mkdir -p /tmp/checker
            set +o pipefail 2>/dev/null; { for n in 100 1000 10000; do seq 1 $n | md5sum; done ; } > /tmp/checker/blob.log; seq 1 1050887 >> /tmp/checker/blob.log; true
            b=$(wc -c </tmp/checker/blob.log); echo "kb: $((b/1024))"
      - persist_to_workspace:
          root: /tmp/checker
          paths:
            - 'blob.log'
  node20-vet:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/checker
      - run:
          name: Take gate output
          command: |
            [ -e /tmp/checker/blob.log ] && echo "exists" || echo "none"
      - run:
          name: Checkout main
          command: git clone --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress bundle
          command: tar -xj -f main-dist-v5.tar.bz2
      - run:
          command: env ./daemon-io
